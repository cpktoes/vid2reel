[project]
name = "v2r"
version = "0.1.0"
description = "Command-line video toolbox."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.26.0",
    "pillow>=12.3.0",
    "pillow-heif>=1.8,<1.9",
]

[project.scripts]
v2r = "v2r.__main__:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
